<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanome fanomezana – ZA SPaFI Toliara</title>
<meta name="description" content="ZA SPaFI Toliara – Zanaka Ampielezana Synodam-Paritany Fisakana eto Toliara. Fikambanana mpihira loterana.">
<meta property="og:title" content="Hanome fanomezana – ZA SPaFI Toliara">
<meta property="og:description" content="Fikambanana mpihira loterana – Toliara">
<meta property="og:image" content="assets/img/photo02.jpg">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="donate">
<main>
  <section class="page-head">
    <div class="hero__bg" style="background-image:url('assets/img/photo05.jpg'); --focus:22%"></div>
    <div class="container"><h1 data-i18n="donate.title"></h1><p data-i18n="donate.intro"></p></div>
  </section>

  <section class="section">
    <div class="container">
      <div class="verse-card" data-verse="donate"></div>
    </div>
  </section>

  <section class="section section--white">
    <div class="container donate-grid">
      <div>
        <h2 data-i18n="donate.how_title"></h2>
        <ol class="how">
          <li data-i18n="donate.step1"></li>
          <li data-i18n="donate.step2"></li>
          <li data-i18n="donate.step3"></li>
        </ol>
        <h3 data-i18n="donate.mm_title"></h3>
        <div id="mobile-money"></div>
      </div>

      <div class="card">
        <h2 data-i18n="form.title"></h2>
        <form class="form" id="donation-form" novalidate>
          <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div>
            <label for="f-name"><span data-i18n="form.name"></span> <span class="req">*</span></label>
            <input id="f-name" name="name" required autocomplete="name">
          </div>
          <div class="row">
            <div>
              <label for="f-amount"><span data-i18n="form.amount"></span> <span class="req">*</span></label>
              <input id="f-amount" name="amount" inputmode="numeric" required>
            </div>
            <div>
              <label for="f-operator" data-i18n="form.operator"></label>
              <select id="f-operator" name="operator"></select>
            </div>
          </div>
          <div class="row">
            <div>
              <label for="f-phone"><span data-i18n="form.phone"></span> <span class="req">*</span></label>
              <input id="f-phone" name="phone" type="tel" required autocomplete="tel">
            </div>
            <div>
              <label for="f-date" data-i18n="form.date"></label>
              <input id="f-date" name="date" type="date">
            </div>
          </div>
          <div>
            <label for="f-ref"><span data-i18n="form.reference"></span> <span class="req">*</span></label>
            <input id="f-ref" name="reference" required>
          </div>
          <fieldset>
            <legend data-i18n="form.visibility"></legend>
            <label class="choice"><input type="radio" name="visibility" value="show" checked> <span data-i18n="form.visibility_show"></span></label>
            <label class="choice"><input type="radio" name="visibility" value="hide"> <span data-i18n="form.visibility_hide"></span></label>
            <p class="hint" data-i18n="form.visibility_note"></p>
          </fieldset>
          <div>
            <label for="f-msg" data-i18n="form.message"></label>
            <textarea id="f-msg" name="message" rows="3"></textarea>
          </div>
          <p class="hint"><span class="req">*</span> <span data-i18n="form.required"></span></p>
          <button class="btn btn--gold" type="submit" data-i18n="form.submit"></button>
          <div id="form-msg" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </section>

  <section class="section" id="donors">
    <div class="container" style="max-width:820px">
      <div class="section__head"><h2 data-i18n="donors.title"></h2><span class="ornament"></span></div>
      <div class="card" id="donor-list" data-needs-data><p class="muted" data-i18n="common.loading"></p></div>
      <div class="share-box mt">
        <h3 data-i18n="share.title"></h3>
        <p class="muted" data-i18n="share.text"></p>
        <button class="btn btn--navy" id="share-btn" type="button" data-i18n="share.btn"></button>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
